# Service を親にした経路（メッシュ内の振り分け）。v1 に 90、v2 に 10。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: kubedeck-mesh
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: web
      port: 8080
  rules:
    - backendRefs:
        - name: web-v1
          port: 8080
          weight: 90
        - name: web-v2
          port: 8080
          weight: 10
