  name: crossns
  namespace: kubedeck-mesh
spec:
  selector: {app: web}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: canary
  namespace: kubedeck-mesh
spec:
  selector: {app: web}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: vsonly
  namespace: kubedeck-mesh
spec:
  selector: {app: web}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: other
  namespace: kubedeck-mesh-b
spec:
  selector: {app: other}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
