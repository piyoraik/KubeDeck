# KubeDeck 経路表示の実測用。確かめたら Namespace ごと消す。
apiVersion: v1
kind: Namespace
metadata:
  name: kubedeck-mesh
  labels:
    istio.io/dataplane-mode: ambient
    kubedeck.dev/purpose: route-verification
---
apiVersion: v1
kind: Namespace
metadata:
  name: kubedeck-mesh-b
  labels:
    istio.io/dataplane-mode: ambient
    kubedeck.dev/purpose: route-verification
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-v1
  namespace: kubedeck-mesh
spec:
  replicas: 2
  selector:
    matchLabels: {app: web, version: v1}
  template:
    metadata:
      labels: {app: web, version: v1}
    spec:
      containers:
        - name: web
          image: registry.k8s.io/e2e-test-images/agnhost:2.47
          args: ["netexec", "--http-port=8080"]
          ports:
            - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-v2
  namespace: kubedeck-mesh
spec:
  replicas: 1
  selector:
    matchLabels: {app: web, version: v2}
  template:
    metadata:
      labels: {app: web, version: v2}
    spec:
      containers:
        - name: web
          image: registry.k8s.io/e2e-test-images/agnhost:2.47
          args: ["netexec", "--http-port=8080"]
          ports:
            - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: kubedeck-mesh
spec:
  replicas: 1
  selector:
    matchLabels: {app: client}
  template:
    metadata:
      labels: {app: client}
    spec:
      containers:
        - name: client
          image: registry.k8s.io/e2e-test-images/agnhost:2.47
          args: ["pause"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: other
  namespace: kubedeck-mesh-b
spec:
  replicas: 1
  selector:
    matchLabels: {app: other}
  template:
    metadata:
      labels: {app: other}
    spec:
      containers:
        - name: web
          image: registry.k8s.io/e2e-test-images/agnhost:2.47
          args: ["netexec", "--http-port=8080"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kubedeck-mesh
spec:
  selector: {app: web}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-v1
  namespace: kubedeck-mesh
spec:
  selector: {app: web, version: v1}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-v2
  namespace: kubedeck-mesh
spec:
  selector: {app: web, version: v2}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# 経路ごとに別の親を用意する（同じ親に複数の経路を重ねると、どれの結果か分からなくなる）。
apiVersion: v1
kind: Service
metadata:
  name: broken
  namespace: kubedeck-mesh
spec:
  selector: {app: web}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
