name: KubeDeck
options:
  bundleIdPrefix: com.piyoraik
  deploymentTarget:
    macOS: "14.0"
  # 表示文言のソース言語。**en にしない。** String Catalog の鍵は日本語の
  # 原文そのもので、訳の無い言語では鍵（＝日本語）へ落ちる。ここを en に
  # すると「en を要求したのに日本語が出る」ことになり、未訳と取り違える。
  # `Resources/Info.plist` の `CFBundleDevelopmentRegion` はこの値を参照する。
  developmentLanguage: ja
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # 表示文言の抽出。コンパイラが 1 ファイルにつき 1 つ `.stringsdata` を
    # 吐き、`Scripts/sync-strings.sh` がそれを String Catalog へ同期する。
    # **`xcstringstool extract` だけで済ませない** —— あちらは型を見ないので
    # 補間が `%arg` のままになり、実際の鍵（`%lld` など）と食い違う。
    SWIFT_EMIT_LOC_STRINGS: "YES"
    # 配布は ad-hoc 署名で固定する。Automatic のままだと Apple Developer
    # アカウントを設定しているマシンで、相手のチームに ID を登録しようとして落ちる。
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # リリースでは Scripts/release.sh が xcodebuild の引数で上書きする。
    # ここの値は「タグを打たずに手元で建てたもの」の版として残る。
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "0.1.0"

packages:
  # アプリ内更新。ad-hoc 署名でも EdDSA 署名だけで検証が通る
  # （Sparkle は新旧の公開鍵が一致すれば署名 identity の変化を許す）。
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.4"

targets:
  KubeDeck:
    type: application
    platform: macOS
    sources:
      - path: Sources/KubeDeck
      - path: Resources/Assets.xcassets
      # 表示文言。ja が原文（＝鍵）、en が訳。鍵は
      # `Scripts/sync-strings.sh` がビルドの `.stringsdata` から同期する。
      # **手で鍵を足さない** —— コードが渡す鍵と 1 文字でも違うと、訳が
      # 当たらずに日本語のまま出て、しかもどこも失敗しない。
      - path: Resources/Localizable.xcstrings
    dependencies:
      - package: Sparkle
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: KubeDeck
        # XcodeGen は指定が無いと 1.0 / 1 を書き込むので、ビルド設定を参照させる。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 piyoraik — MIT License"
        # 更新の配信元。GitHub Releases の `latest` は常に最新の
        # プレリリースでないリリースを指すので、URL を版ごとに変えなくてよい。
        SUFeedURL: https://github.com/piyoraik/KubeDeck/releases/latest/download/appcast.xml
        # 秘密鍵は login キーチェーンの「Private key for signing Sparkle updates」。
        # CI では Secrets の SPARKLE_PRIVATE_KEY から渡す。
        SUPublicEDKey: VccRF2b3DKHj1A5TpxT2lSCx3KnqpeHd14n+q66f2GM=
        # 確認するかどうかと間隔は Preferences が持つ（設定は 1 か所に集める）。
        # このキーを置くと Sparkle 自身の「自動で確認しますか？」の問い合わせが
        # 出なくなる。置かないと、設定にも同じ項目があるのに起動 2 回目に
        # 別の聞き方で尋ねられ、どちらが効いているのか分からなくなる。
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.piyoraik.KubeDeck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # kubectl を子プロセスで起動するので App Sandbox は使わない。
        # Hardened Runtime も外す（署名が ad-hoc のため）。
        ENABLE_HARDENED_RUNTIME: false
        SWIFT_STRICT_CONCURRENCY: complete

  # 状態の判定・単位の換算・関係の突き合わせは、どれも純粋関数で UI に
  # 依存しない。ここが回帰すると「kubectl と表示がずれる」という、
  # このアプリで最も気付きにくい壊れ方をするので、合成 JSON で固める。
  #
  # **テストは ja で走らせる**（下の `schemes:` を参照）。表示文言を
  # 断定しているテストがあるので、走らせる言語を固定しないと
  # 「手元では通るが CI では落ちる」になる。
  KubeDeckTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/KubeDeckTests
    dependencies:
      - target: KubeDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.piyoraik.KubeDeckTests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_STRICT_CONCURRENCY: complete

# **スキームを明示で持つ。** ターゲットの `scheme: testTargets:` の略記では
# テストを走らせる言語を指定できない。
schemes:
  KubeDeck:
    build:
      targets:
        KubeDeck: all
    run:
      config: Debug
    test:
      config: Debug
      # **走らせる言語を固定する。** `SafetyTests` や `PlacementTraceTests` は
      # 「『消えています』と書くか」「『取得している範囲』と書き分けるか」まで
      # 断定しており、それはこのリポジトリが守りたい判断そのもの（CLAUDE.md に
      # 根拠が書いてある）。ロケール任せにすると、日本語環境の手元では通って
      # **英語の CI ランナーでだけ落ちる**。訳のほうの網羅は
      # `Scripts/sync-strings.sh` が別に見る。
      language: ja
      region: JP
      targets:
        - KubeDeckTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
