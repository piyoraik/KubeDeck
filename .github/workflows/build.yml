name: ビルド

# 壊れたまま タグを打たないための番。リリースと同じ Release 構成で建てる。
# **Debug で確かめない。** 配るのは Release なので、最適化で出る問題は
# ここで拾えないと、タグを打った後に気付くことになる。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: 道具の版を控える
        run: xcodebuild -version

      - name: xcodegen を入れる
        run: brew install xcodegen

      # **テストをゲートに繋ぐ。** 以前はここが建てるだけで、テストは
      # 1 度も走っていなかった。`Tests/KubeDeckTests` が押さえているのは
      # 「壊れても気付きにくいところ」（kubectl の stderr の書式、単位の換算、
      # 状態の判定、読み取り専用の穴）で、走らせなければ意味を成さない。
      # **建てるより先に置く。** 論理の回帰は Release ビルドを待たずに落とす。
      - name: 確かめる
        run: |
          xcodegen generate
          mkdir -p build
          # **出力を head に通さない。** パイプを早く閉じると xcodebuild が
          # 居残り、次のビルドが XCBuildData の database is locked で落ちる。
          set +e
          xcodebuild test -project KubeDeck.xcodeproj -scheme KubeDeck \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            > build/xcodebuild-test.log 2>&1
          STATUS=$?
          set -e
          grep -E "^✘|Expectation failed|error:" build/xcodebuild-test.log | head -40 || true
          if [[ $STATUS -ne 0 ]]; then
            tail -60 build/xcodebuild-test.log
            exit $STATUS
          fi
          grep -E "Test run with" build/xcodebuild-test.log || true

      # **未訳をここで落とす。** 未訳は日本語のまま出るだけで、どこも失敗
      # しない（「無い」と「取れていない」を混ぜないのと同じで、気付く手立てを
      # 別に置く必要がある）。テストでは見ない —— あちらは ja 固定で走らせて
      # いるので、訳が 1 つも無くても通ってしまう。
      #
      # `.stringsdata` は直前のテスト実行で吐かれている（`SWIFT_EMIT_LOC_STRINGS`）。
      - name: 表示文言の訳を確かめる
        run: |
          OBJROOT=build/DerivedData/Build/Intermediates.noindex
          ARGS=()
          while IFS= read -r f; do
            ARGS+=("--stringsdata=$f")
          done < <(find "$OBJROOT/KubeDeck.build" \
            -path "*/KubeDeck.build/Objects-normal/*" -name "*.stringsdata" | sort)
          if [[ ${#ARGS[@]} -eq 0 ]]; then
            echo "'.stringsdata' が無い。SWIFT_EMIT_LOC_STRINGS を確かめること" >&2
            exit 1
          fi
          # **カタログのほうは書き換えない。** CI で同期すると、コミットされて
          # いない鍵の増減が結果に混ざる。写しに対して同期して、差だけを見る。
          #
          # **写しの名前を変えない。** `xcstringstool sync` はファイル名から
          # テーブル名を決めるので、`strings-check.xcstrings` にすると
          # `Localizable` テーブルと一致せず、**全 802 鍵が「使われていない」に
          # なる**（実測。エラーにはならないので気付きにくい）。
          mkdir -p build/strings-check
          cp Resources/Localizable.xcstrings build/strings-check/Localizable.xcstrings
          "$(xcode-select -p)/usr/bin/xcstringstool" sync \
            build/strings-check/Localizable.xcstrings "${ARGS[@]}"
          python3 - build/strings-check/Localizable.xcstrings <<'PY'
          import json, sys
          strings = json.load(open(sys.argv[1]))["strings"]
          missing, stale = [], []
          for key, entry in strings.items():
              if entry.get("extractionState") == "stale":
                  stale.append(key)
                  continue
              if entry.get("shouldTranslate") is False:
                  continue
              unit = entry.get("localizations", {}).get("en", {}).get("stringUnit", {})
              if not unit.get("value"):
                  missing.append(key)
          print(f"鍵 {len(strings)} / 未訳(en) {len(missing)} / 使われていない鍵 {len(stale)}")
          for key in missing[:40]:
              print("  未訳:", repr(key))
          for key in stale[:40]:
              print("  使われていない:", repr(key))
          if missing or stale:
              print("Scripts/sync-strings.sh を実行して直してください", file=sys.stderr)
              sys.exit(1)
          PY

      - name: 建てる
        run: |
          mkdir -p build
          # **出力を head に通さない。** パイプを早く閉じると xcodebuild が居残る。
          set +e
          xcodebuild -project KubeDeck.xcodeproj -scheme KubeDeck \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            build > build/xcodebuild.log 2>&1
          STATUS=$?
          set -e
          grep -E "error:|warning:" build/xcodebuild.log | grep "Sources/KubeDeck" || true
          if [[ $STATUS -ne 0 ]]; then
            tail -60 build/xcodebuild.log
            exit $STATUS
          fi

      - name: 署名が崩れていないこと
        # Sparkle は「署名付きだったものが署名無しになる」更新を拒む。
        # ad-hoc であっても、崩れていると次の版から更新できなくなる。
        run: codesign --verify --deep --strict build/DerivedData/Build/Products/Release/KubeDeck.app

      - name: ビルドの記録を残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild*.log
